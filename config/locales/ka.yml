    accept_notification:
      subject: "მომხმარებელმა %{nickname} მიიღო თქვენი მოწვევა"
      body: "მომხმარებელმა %{nickname} მიიღო თქვენი მოწვევა და გაწევრიანდა გუნდში"
    password_reset:
      subject: "პაროლის განულება საიტზე %{host}"
      body: |
        %{nickname}, ვიღაცამ მოითხოვა თქვენი ანგარიშის პაროლის განულება.

