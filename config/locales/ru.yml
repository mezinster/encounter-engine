  notification_mailer:
    # Sent in the recipient's locale, not the sender's -- see
    # NotificationMailer#mail_in_recipient_locale. Body text below is
    # unchanged from the pre-port app/mailers/views/notification_mailer/
    # *.text.erb templates (diffed word-for-word while porting), except for
    # welcome_letter's host references. The Merb original hardcoded the
    # subject as the static string "Регистрация на bienkg" (that "bienkg"
    # typo -- no dot -- is original, not introduced here) while the body
    # said "bien.kg" (correctly spelled) -- two different spellings of the
    # same one hardcoded installation. Fix round 1: both subject and body
    # now interpolate %{host} (see NotificationMailer#app_host), which
    # fixes the typo as a side effect (the interpolated value has the dot)
    # and keeps subject/body/ru/en all naming the same host consistently.
    welcome_letter:
      subject: "Регистрация на %{host}"
      body: |-
        Спасибо за регистрацию!

        Вы зарегистрировались на сайте %{host} и теперь можете войти со следующими данными:

        Email:  %{email}
        Пароль: %{password}

        Всего хорошего :)
    invitation_notification:
      subject: "Вас пригласили вступить в команду %{team_name}"
      body: |-
        Вас пригласили вступить в команду %{team_name}
        Чтобы принять приглашение или отказаться от него, зайдите в ваш личный кабинет
    reject_notification:
      subject: "Пользователь %{nickname} отказался от приглашения"
      body: "Пользователь %{nickname} отказался от приглашения вступить в вашу команду"
    accept_notification:
      subject: "Пользователь %{nickname} принял Ваше приглашение"
      body: "Пользователь %{nickname} принял Ваше приглашение и вступил в команду"
  # Language names for the switcher (app/views/layouts/_header.html.erb) and
  # the profile form's language field (app/views/users/edit.html.erb).
  # Deliberately identical across every locale file: each language is named
  # in its own endonym ("Русский", "English", ...) rather than translated, so
  # a reader sees their own language's name spelled the way they'd recognise
  # it no matter which locale currently renders the page. spec/i18n_spec.rb's
  # untranslated-copy-paste check knows about this key and allows it.
