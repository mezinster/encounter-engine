service: encounter-engine
image: mezinster/encounter-engine

servers:
  web:
    - 23.100.7.86

# Uploaded game files live here. Without this volume they'd sit in the
# container's writable layer and vanish at the next deploy -- a prerequisite
# for Phase 2, not a follow-up.
volumes:
  - encounter_engine_storage:/rails/storage

# kamal-proxy rebuilds its whole route table from this block on every deploy.
# A host registered by hand on the server (`kamal proxy ...`) is NOT preserved --
# it disappears at the next deploy, and nothing in the deploy output says so.
# Any hostname this app should answer on has to be listed here.
#
# Both A-records point at the server above. kamal-proxy provisions a Let's
# Encrypt certificate per host automatically: no certbot, no cert files in CI,
# no extra secrets.
#
# DO NOT add mezin.by, www.mezin.by, mezin.eu or www.mezin.eu here. Those four
# belong to a separate parked service on this same host (static nginx holding
# the dormant WordPress site). Claiming one here would take the blog's domain
# away from the parked page, and would then collide with WordPress when that
# site is restored.
#
# That parked nginx runs with `--health-check-path /`: kamal-proxy defaults to
# /up, which Rails serves but a plain nginx container does not. Any future
# non-Rails sidecar behind this proxy needs the same.
proxy:
  ssl: true
  host: game.mezin.eu,game.mezin.by
  app_port: 3000
  healthcheck:
    path: /up
  # 64 MB. Ten files at the 25 MB per-file limit would be 250 MB of request body
  # buffered on a host with ~1.1 GB spare RAM. This is the only layer that acts
  # before Puma and before Rack writes a tempfile to /tmp. The cost: a batch
  # over this is rejected by kamal-proxy as a bare 413, before Rails can render
  # a translated message.
  buffering:
    max_request_body: 67108864

registry:
  server: ghcr.io
  username: mezinster
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64
  # Built in CI and pushed. This host has 1 vCPU and ~1.1 GB spare; building
  # here would starve danted and the APRS forwarders.
  remote: false

ssh:
  user: mezinster

env:
  clear:
    RAILS_ENV: production
    TZ: Europe/Vienna
    DEFAULT_LOCALE: ru
    # Deliberately ONE host, not the pair in `proxy.host` above. This is what
    # mailers build absolute URLs from, so it is the canonical domain: the app
    # answers on both, every emailed link points at game.mezin.eu.
    APP_HOST: game.mezin.eu
    # Changing this host is step 4 of docs/runbooks/smtp-failover.md. The warm
    # spare is Fastmail (smtp.fastmail.com) -- proven on every run of the SMTP
    # probe workflow, never used by the app until someone cuts over.
    SMTP_ADDRESS: smtp.gmail.com
    SMTP_PORT: "587"
  secret:
    - SECRET_KEY_BASE
    - DATABASE_URL
    - SMTP_USERNAME
    - SMTP_PASSWORD
    # Derived from SMTP_USERNAME rather than set here — see .kamal/secrets.
    - MAIL_FROM
    - ANTHROPIC_API_KEY

accessories:
  db:
    image: ghcr.io/mezinster/encounter-engine-postgres:latest
    host: 23.100.7.86
    port: "127.0.0.1:5432:5432"
    env:
      clear:
        POSTGRES_USER: encounter
        POSTGRES_DB: encounter_production
        WALG_AZ_PREFIX: azure://encounter-engine-wal
        # No AZURE_STORAGE_ACCESS_KEY. The VM holds a system-assigned managed
        # identity with Storage Blob Data Contributor on this account only, and
        # wal-g's Azure default credential chain fetches short-lived tokens from
        # IMDS. A storage account name is not a secret; the key would be, and it
        # does not exist here. If Task 4 Step 6 found IMDS unreachable from a
        # container, add AZURE_STORAGE_ACCESS_KEY to the secret list below.
        AZURE_STORAGE_ACCOUNT: eewalxypkl1ft
      secret:
        - POSTGRES_PASSWORD
    volumes:
      - encounter_engine_pg_data:/var/lib/postgresql/data
