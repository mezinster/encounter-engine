name: Deploy

on:
  workflow_dispatch:
    inputs:
      command:
        description: "kamal subcommand"
        type: choice
        options: [deploy, setup]
        default: deploy

# Two deploys at once would race on the just-in-time NSG rule below, and the
# second would delete the first's access mid-deploy.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      # Required for OIDC federation with Azure. `contents: read` must be stated
      # explicitly: naming any permission resets all the others to none.
      id-token: write
      contents: read

    # Every action below is pinned to a COMMIT SHA, not a tag, and only in this
    # workflow and database.yml -- the two that hold production secrets and can
    # reach the server. A tag like @v7 is mutable: whoever controls the action's
    # repository can repoint it, and the next deploy would silently run
    # different code with SECRET_KEY_BASE, the registry password and the SSH key
    # in its environment. A SHA cannot be repointed.
    #
    # The trailing comment is the human-readable version and is not decoration:
    # Dependabot parses it, and updates both the SHA and the comment together.
    #
    # ci.yml and images.yml stay on major tags on purpose. They hold no secrets,
    # publish nothing, and the churn of SHA bumps there would buy nothing.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          bundler-cache: true

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.KAMAL_REGISTRY_PASSWORD }}

      - name: Build and push the PostgreSQL image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.postgres
          push: true
          tags: ghcr.io/mezinster/encounter-engine-postgres:latest

      - uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Pin the host key
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # Read from the host itself over an already-trusted session, not
          # scanned from the network: ssh-keyscan trusts whatever answers, which
          # on a hostile path is the attacker. If this ever stops matching, the
          # host was rebuilt (or something is wrong) — do not "fix" it by
          # scanning; re-read /etc/ssh/ssh_host_ed25519_key.pub over a known-good
          # connection.
          echo '23.100.7.86 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBESJGNohuozwA1DTg1Tjlghw/G0krguiE0Enw5BfMew' >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # The NSG restricts port 22 to a short allowlist of source addresses, and
      # GitHub-hosted runners are in none of them — a deploy without the two
      # steps below dies with Net::SSH::ConnectionTimeout after ~136s, which
      # reads like a broken key but is a dropped packet.
      #
      # Rather than widening the allowlist permanently, each run opens 22 to its
      # own address and closes it again. Authentication is OIDC federation
      # against a user-assigned managed identity whose federated credential
      # trusts exactly one subject —
      # repo:mezinster/encounter-engine:environment:production — and which holds
      # Network Contributor on this one NSG and nothing else. No Azure
      # credential is stored in GitHub.
      - name: Authenticate to Azure
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Open SSH to this runner only
        run: |
          RUNNER_IP=$(curl -fsS --max-time 10 https://api.ipify.org || curl -fsS --max-time 10 https://ifconfig.me)
          if [ -z "$RUNNER_IP" ]; then echo "could not determine runner IP"; exit 1; fi
          echo "opening 22 for ${RUNNER_IP}/32"
          # Retried because the Azure CLI itself is flaky here, not because the
          # command is: under Python 3.14 azure.cli.core loads command modules
          # across threads, and that concurrent import path deadlocks on
          # _ModuleLock (Azure/azure-cli#32980). Observed live -- this step died
          # with _frozen_importlib._DeadlockError while the identical
          # `az network nsg rule delete` in the cleanup step of the SAME job
          # succeeded, which is what identifies it as a race rather than a
          # misconfiguration. Without the retry, an upstream race fails a deploy.
          for attempt in 1 2 3 4 5; do
            if az network nsg rule create \
                 --resource-group mezineu --nsg-name webNSG \
                 --name "gha-jit-${{ github.run_id }}" \
                 --priority 900 --direction Inbound --access Allow --protocol Tcp \
                 --source-address-prefixes "${RUNNER_IP}/32" \
                 --destination-port-ranges 22 \
                 --description "JIT SSH for GitHub Actions run ${{ github.run_id }}" \
                 --output none; then
              echo "rule created on attempt ${attempt}"
              exit 0
            fi
            echo "attempt ${attempt} failed; retrying in 10s"
            sleep 10
          done
          echo "could not open port 22 after 5 attempts"
          exit 1

      - name: Deploy
        env:
          SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.KAMAL_REGISTRY_PASSWORD }}
        run: bundle exec kamal ${{ inputs.command }}

      # `always()` matters more than it looks: without it a failed deploy leaves
      # port 22 open to that runner's address indefinitely, and the address is
      # recycled to other GitHub customers. `|| true` covers the case where the
      # Azure login itself failed and there is no rule to remove.
      - name: Close SSH again
        if: always()
        run: |
          # Same upstream flakiness applies here, and this one matters more than
          # opening did: a rule left behind means port 22 stays open to an
          # address GitHub recycles to other customers.
          #
          # Deliberately does NOT fail the job -- that would mark a successful
          # deploy as failed -- but it does emit a ::error:: annotation, because
          # a silent cleanup failure is the one outcome nobody would notice.
          # `az ... delete` also exits 0 when the rule does not exist, so the
          # case where login failed and nothing was ever created passes cleanly.
          cleaned=no
          for attempt in 1 2 3 4 5; do
            if az network nsg rule delete \
                 --resource-group mezineu --nsg-name webNSG \
                 --name "gha-jit-${{ github.run_id }}" \
                 --output none 2>/dev/null; then
              cleaned=yes
              break
            fi
            echo "cleanup attempt ${attempt} failed; retrying in 10s"
            sleep 10
          done
          if [ "$cleaned" != "yes" ]; then
            echo "::error::Failed to remove JIT rule gha-jit-${{ github.run_id }} from webNSG after 5 attempts. Port 22 may still be open to this runner's address. Remove it by hand."
          fi
          echo "remaining inbound rules:"
          az network nsg rule list --resource-group mezineu --nsg-name webNSG \
            --query "[].{name:name,priority:priority,ports:destinationPortRange}" -o table 2>/dev/null || true
