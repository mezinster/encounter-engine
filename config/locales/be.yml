# Belarusian.
#
# Registered on 2026-08-09 and translated in the same programme -- see
# docs/superpowers/plans/2026-08-09-locale-translation-delivery.md.
#
# MACHINE-PRODUCED, NOT REVIEWED BY A NATIVE SPEAKER. The same status uk and
# ka carry (see CLAUDE.md). Structurally verified -- every key in ru.yml has a
# value here, every interpolation variable matches -- but the wording has not
# been read by anyone who speaks Belarusian. Treat reported wording problems
# as real.
#
# Translated from ru.yml, cross-checked against en.yml. Belarusian is close
# enough to Russian that machine translation drifts back into it, so the game
# jargon was fixed deliberately and used consistently: игра -> гульня,
# команда -> каманда, задание -> заданне (the puzzle a level poses),
# уровень -> узровень (its numbered position), код -> код (the answer string
# players find in the city), подсказка -> падказка, игрок -> гулец,
# заявка -> заяўка, "сойти с дистанции" -> "сысці з дыстанцыі" (quit
# mid-game).
