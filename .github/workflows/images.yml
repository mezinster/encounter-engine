name: Images

on:
  push:
    branches-ignore: []
  workflow_dispatch:

jobs:
  app-image:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: smoke
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build the application image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: encounter-engine:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prove the image actually serves
        run: |
          docker run -d --name ee-smoke --network host \
            -e SECRET_KEY_BASE=$(openssl rand -hex 64) \
            -e DATABASE_URL="postgresql://postgres:smoke@127.0.0.1:5432/postgres" \
            -e APP_HOST=game.mezin.eu \
            -e SMTP_USERNAME=x -e SMTP_PASSWORD=y \
            encounter-engine:test
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/up || true)
            [ "$code" = "200" ] && echo "up: 200 after ${i}s" && exit 0
            sleep 1
          done
          echo "FAILED: /up never returned 200"
          docker logs ee-smoke
          exit 1

      # The RSpec job proves libvips exists on a Debian ruby image with an
      # apt-get step; that says nothing about the image we actually ship.
      # `bundle exec`, not bare ruby: the entrypoint is overridden here, so
      # nothing else puts the bundle on the load path.
      #
      # This also asserts HEIC support specifically, not just that libvips
      # loads: libvips can be built without HEIC (see the Dockerfile comment
      # on libheif1), and a photo from any iPhone arrives as HEIC -- it is the
      # one in-scope format that actually needs conversion. A bare
      # Vips::Image.black smoke test passes even when heifload is missing, so
      # it proves nothing about the capability this feature depends on.
      - name: Prove libvips is in the image, with HEIC support
        run: |
          docker run --rm --entrypoint bundle encounter-engine:test \
            exec ruby <<'RUBY'
          require "image_processing/vips"

          abort("libvips broken in image") unless Vips::Image.black(4, 4).width == 4

          abort("libvips has no HEIC support in image") unless Vips.get_suffixes.include?(".heic")

          begin
            Vips::Operation.new("heifload")
          rescue Vips::Error => e
            abort("heifload operation unavailable in image: #{e.message}")
          end

          puts "libvips ok, HEIC ok"
          RUBY

  postgres-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build the PostgreSQL image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.postgres
          load: true
          tags: ee-postgres:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The checks themselves live in a script rather than here, because
      # deploy.yml runs the same ones before pushing this image to GHCR and two
      # copies would drift. See the header of that file.
      - name: Smoke-test the PostgreSQL image
        run: .github/scripts/smoke-postgres-image.sh ee-postgres:test
