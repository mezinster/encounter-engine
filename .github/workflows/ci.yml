name: CI

on:
  push:
    branches: ["master"]
  pull_request:

jobs:
  cucumber:
    name: Cucumber
    runs-on: ubuntu-latest
    container: ruby:3.3.12

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install bundler
        run: gem install bundler --no-document

      - name: Cache gems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor/bundle
          key: gems-${{ hashFiles('Gemfile.lock') }}
          restore-keys: gems-

      - name: Install gems
        run: |
          bundle config set --local without production
          bundle config set --local path vendor/bundle
          bundle install --jobs 4 --retry 3

      - name: Prepare test database
        run: bin/rails db:test:prepare

      # The authoritative suite: features/**/*.feature is the contract this
      # port was validated against, byte-identical to what the Merb app
      # passed. 234 scenarios covering signup, teams, invitations, game
      # creation, levels, hints, the game-passing loop and i18n.
      - name: Cucumber
        run: bundle exec cucumber --format progress

  rspec:
    name: RSpec
    runs-on: ubuntu-latest
    container: ruby:3.3.12

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install bundler
        run: gem install bundler --no-document

      # The countdown pluralises client-side, so the only honest test of its
      # plural rule runs the emitted JavaScript rather than a Ruby
      # reimplementation of it -- see spec/helpers/countdown_plural_spec.rb and
      # the node harness in spec/views/countdown_spec.rb.
      #
      # This job runs inside container: ruby:3.3.12, a Debian image with no
      # node, and the runner's own node is not visible from in there. Without
      # this step those specs do not merely fail to run, they LOOK fine: the
      # four pre-existing timeDifference examples guard themselves with skip(),
      # so they reported as pending in every CI run from the day they were
      # written until 2026-08-09, which is indistinguishable from passing in
      # the log.
      # node-version is the Node the SPECS run against, and is unrelated to the
      # Node the action itself runs on -- every action here moved to a Node 24
      # runtime in this bump, which changes nothing about the line below. Do
      # not "align" them: this pins the interpreter the countdown's plural rule
      # is evaluated by, and changing it changes what the test proves.
      - name: Install node (for the JavaScript-evaluating specs)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      # Same reasoning as the node step above, same failure mode. This job runs
      # in container: ruby:3.3.12 — Debian with no libvips — and
      # spec/image_processing_spec.rb RAISES rather than skips when it is
      # missing, so removing this step turns the suite red rather than quietly
      # shedding coverage. Do not convert that spec to a skip to avoid needing
      # this step.
      - name: Install libvips (for the image-processing specs)
        run: |
          apt-get update -qq
          apt-get install --no-install-recommends -y libvips42 libheif1

      - name: Cache gems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor/bundle
          key: gems-${{ hashFiles('Gemfile.lock') }}
          restore-keys: gems-

      - name: Install gems
        run: |
          bundle config set --local without production
          bundle config set --local path vendor/bundle
          bundle install --jobs 4 --retry 3

      # Cheapest place to run this: it takes seconds and needs nothing this
      # job doesn't already have. It caught the production-boot blocker
      # twice during this migration -- guard against it recurring.
      - name: Zeitwerk check
        run: bin/rails zeitwerk:check

      - name: Prepare test database
        run: bin/rails db:test:prepare

      - name: RSpec
        run: bundle exec rspec

  # The other half of the reasoning in .github/dependabot.yml.
  #
  # That file deliberately leaves the bundler ecosystem out, because a stream of
  # automated gem bumps against a frozen acceptance contract is a different risk
  # class from bumping a CI action. The cost of that decision is that nothing
  # would notice a published advisory against one of the 139 gems in
  # Gemfile.lock. This job is what notices. It bumps nothing -- it reads the
  # lockfile and compares it against ruby-advisory-db -- so it buys the warning
  # without buying the churn.
  #
  # bundler-audit is installed here rather than added to the Gemfile on purpose.
  # The gem cache above is keyed on hashFiles('Gemfile.lock'), so putting it in
  # the bundle would invalidate that cache for every job, and it would churn a
  # lockfile the dependabot config is written to leave alone. The tool only
  # needs to READ Gemfile.lock; it never has to be resolved alongside the app.
  #
  # Blocking rather than advisory: the baseline was clean when this was added
  # (2026-08-11, 1232 advisories, no vulnerabilities found). A security check
  # nobody has to act on is one nobody reads.
  audit:
    name: Gem advisories
    runs-on: ubuntu-latest
    container: ruby:3.3.12

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install bundler-audit
        run: gem install bundler-audit --no-document

      # --update clones ruby-advisory-db at run time, which is the point: a
      # pinned copy of the advisory database ages into telling you nothing.
      - name: Check Gemfile.lock against ruby-advisory-db
        run: bundle-audit check --update
