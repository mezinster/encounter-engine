name: Images

on:
  push:
    branches-ignore: []
  workflow_dispatch:

jobs:
  app-image:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: smoke
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build the application image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: encounter-engine:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prove the image actually serves
        run: |
          docker run -d --name ee-smoke --network host \
            -e SECRET_KEY_BASE=$(openssl rand -hex 64) \
            -e DATABASE_URL="postgresql://postgres:smoke@127.0.0.1:5432/postgres" \
            -e APP_HOST=game.mezin.eu \
            -e SMTP_USERNAME=x -e SMTP_PASSWORD=y \
            encounter-engine:test
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/up || true)
            [ "$code" = "200" ] && echo "up: 200 after ${i}s" && exit 0
            sleep 1
          done
          echo "FAILED: /up never returned 200"
          docker logs ee-smoke
          exit 1

      # The one check in this repository capable of noticing that docs/manual
      # is missing from the image. Every spec runs from a checkout, where these
      # files always exist, so the whole suite stays green against an image
      # that 404s -- the same seam that made the libvips package name look
      # correct for months. The container from the previous step is still
      # running as ee-smoke on the host network.
      - name: Prove the manual is in the image and renders
        run: |
          code=$(curl -s -o /tmp/manual.html -w "%{http_code}" http://127.0.0.1:3000/manual || echo 000)
          if [ "$code" != "200" ]; then
            echo "FAILED: /manual returned $code"
            docker logs ee-smoke | tail -40
            exit 1
          fi
          grep -q "Руководство пользователя" /tmp/manual.html || {
            echo "FAILED: /manual answered 200 without the manual's own heading in it"
            head -60 /tmp/manual.html
            exit 1
          }
          grep -q "<table>" /tmp/manual.html || {
            echo "FAILED: /manual rendered without tables -- the GFM parser is not active"
            exit 1
          }
          echo "manual ok"

      # The RSpec job proves libvips exists on a Debian ruby image with an
      # apt-get step; that says nothing about the image we actually ship.
      # `bundle exec`, not bare ruby: the entrypoint is overridden here, so
      # nothing else puts the bundle on the load path.
      #
      # This also asserts HEIC support specifically, not just that libvips
      # loads: libvips can be built without HEIC (see the Dockerfile comment
      # on libheif1), and a photo from any iPhone arrives as HEIC -- it is the
      # one in-scope format that actually needs conversion. A bare
      # Vips::Image.black smoke test passes even when heifload is missing, so
      # it proves nothing about the capability this feature depends on.
      #
      # It must actually DECODE a HEIC image, not merely confirm the loader is
      # registered. Vips.get_suffixes.include?(".heic") and
      # Vips::Operation.new("heifload") are both satisfied by libheif1 alone,
      # independent of whether any HEVC decoder is installed -- this exact
      # false positive was found on a developer's machine: those two checks
      # both said "HEIC ok" while every real HEIC decode failed, because
      # libheif was present with only its AV1 plugins and not
      # libheif-plugin-libde265 (HEIC is HEVC, not AV1). Registration is not
      # capability. .dockerignore excludes spec/, so the fixture bytes -- the
      # same real 64x64 HEIC as spec/fixtures/files/photo.heic -- are inlined
      # below rather than copied into the image.
      #
      # -i is load-bearing, and its absence is silent. `ruby` with no script
      # argument reads its program from stdin; `docker run` does NOT forward
      # the client's stdin into the container unless -i is given. Without it
      # the container's ruby reads EOF immediately, executes an empty program
      # and exits 0 -- so this whole step passed unconditionally, proving
      # nothing, which is how it shipped the first time.
      #
      # The sentinel grep below is the belt to that braces: a step that cannot
      # be run locally (no docker daemon on a dev box, and the image only
      # exists in CI) must not be able to succeed by producing nothing. If the
      # script does not run, there is no output, and no output is now a failure.
      - name: Prove libvips is in the image, with HEIC support
        run: |
          set -o pipefail
          output=$(docker run --rm -i --entrypoint bundle encounter-engine:test \
            exec ruby <<'RUBY'
          require "image_processing/vips"
          require "base64"
          require "tempfile"

          abort("libvips broken in image") unless Vips::Image.black(4, 4).width == 4

          heic_bytes = Base64.decode64(<<~B64)
            
          B64

          Tempfile.create(["probe", ".heic"]) do |f|
            f.binmode
            f.write(heic_bytes)
            f.flush

            begin
              jpeg = Vips::Image.new_from_file(f.path).write_to_buffer(".jpg")
              abort("HEIC decode in image produced no bytes") if jpeg.nil? || jpeg.bytesize.zero?

              # Re-decode the OUTPUT, not the input's container header: a
              # loader that can only parse the box structure (the exact false
              # positive above) can still report the input's declared
              # dimensions without ever having decoded a pixel. Only the
              # round-tripped JPEG proves real pixels came out.
              round_tripped = Vips::Image.new_from_buffer(jpeg, "")
              unless round_tripped.width == 64 && round_tripped.height == 64
                abort("HEIC round-trip in image produced wrong dimensions: #{round_tripped.width}x#{round_tripped.height}")
              end
            rescue Vips::Error => e
              abort("libvips cannot actually decode HEIC in this image (loader registered but not capable): #{e.message}")
            end
          end

          puts "libvips ok, HEIC ok"
          RUBY
          )
          echo "$output"
          echo "$output" | grep -q "libvips ok, HEIC ok" || {
            echo "FAILED: the probe printed nothing -- the script never reached ruby."
            exit 1
          }

  postgres-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build the PostgreSQL image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.postgres
          load: true
          tags: ee-postgres:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The checks themselves live in a script rather than here, because
      # deploy.yml runs the same ones before pushing this image to GHCR and two
      # copies would drift. See the header of that file.
      - name: Smoke-test the PostgreSQL image
        run: .github/scripts/smoke-postgres-image.sh ee-postgres:test
