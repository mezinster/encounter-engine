name: Docs site

# The paths filter is not tidiness. Without it every merge to master rebuilds
# and redeploys a site that did not change, and this repository already runs
# vm-scale.yml every fifteen minutes.
#
# The two lists below are duplicated verbatim, because GitHub Actions offers no
# anchor for this key. Keep them identical, and note the asymmetry if they ever
# drift: a path in `pull_request` but missing from `push` means merged changes
# silently stop rebuilding the site -- nothing fails, the site just quietly
# goes stale. The reverse merely runs a build the PR did not need, and is
# visible immediately.
on:
  push:
    branches: ["master"]
    paths:
      - "docs/manual/**"
      - "docs/runbooks/restore.md"
      - "docs/perf/README.md"
      - "docs-site/**"
      - "bin/stage-docs-site"
      - ".github/workflows/docs-site.yml"
  pull_request:
    paths:
      - "docs/manual/**"
      - "docs/runbooks/restore.md"
      - "docs/perf/README.md"
      - "docs-site/**"
      - "bin/stage-docs-site"
      - ".github/workflows/docs-site.yml"
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs-site/requirements.txt

      - name: Install MkDocs
        run: pip install -r docs-site/requirements.txt

      # Ruby is preinstalled on ubuntu-latest and the stager needs no gems --
      # it is plain stdlib, deliberately, so this job needs no bundle install.
      - name: Stage the publishable subset of docs/
        run: ruby bin/stage-docs-site

      # --strict is what makes validation.anchors bite: a Cyrillic heading
      # anchor that stopped matching its links fails here rather than shipping
      # links that quietly go nowhere.
      - name: Build the site
        run: mkdocs build --strict -f docs-site/mkdocs.yml

      - name: Upload the artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: docs-site/site

  deploy:
    name: Deploy
    # Pull requests build but never publish: the closure check and --strict
    # report in the PR, before anything reaches the public web.
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest

    # Two merges must not race a half-built site onto the live domain -- but the
    # group belongs on THIS job, not on the workflow. At workflow level every
    # pull_request run joined the same group, so a PR push could cancel a
    # pending master deploy: a cancelled run is not a failed run, nobody is
    # notified, and the public site silently stays a merge behind.
    concurrency:
      group: pages
      cancel-in-progress: false

    permissions:
      pages: write
      id-token: write
      # Naming any permission zeroes the rest, and deploy-pages resolves the
      # uploaded artifact through the Actions API. Free if it turns out to be
      # unnecessary; saves a failed first-ever deploy if it is not.
      actions: read

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
