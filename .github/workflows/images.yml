name: Images

on:
  push:
    branches-ignore: []
  workflow_dispatch:

jobs:
  app-image:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: smoke
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build the application image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: encounter-engine:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prove the image actually serves
        run: |
          docker run -d --name ee-smoke --network host \
            -e SECRET_KEY_BASE=$(openssl rand -hex 64) \
            -e DATABASE_URL="postgresql://postgres:smoke@127.0.0.1:5432/postgres" \
            -e APP_HOST=game.mezin.eu \
            -e SMTP_USERNAME=x -e SMTP_PASSWORD=y \
            encounter-engine:test
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/up || true)
            [ "$code" = "200" ] && echo "up: 200 after ${i}s" && exit 0
            sleep 1
          done
          echo "FAILED: /up never returned 200"
          docker logs ee-smoke
          exit 1

  postgres-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build the PostgreSQL image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.postgres
          load: true
          tags: ee-postgres:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: wal-g must be runnable INSIDE the image
        run: docker run --rm ee-postgres:test wal-g --version

      - name: PostgreSQL must still start with the tuning file
        run: |
          docker run -d --name pg-smoke -e POSTGRES_PASSWORD=smoke ee-postgres:test
          # pg_isready alone is not enough. The official entrypoint runs initdb
          # against a TEMPORARY server, then shuts it down before starting the
          # real one -- so pg_isready can answer "ready", the loop breaks, and
          # the psql calls below land exactly in the shutdown window with
          # "FATAL: the database system is shutting down". Observed twice on
          # 2026-08-07 and again on 2026-08-10, on branches touching no
          # Postgres file.
          #
          # Neither is the server's own startup banner. The temp server is a
          # full PostgreSQL start: it logs "database system is ready to accept
          # connections" to the container's stdout exactly like the real one
          # (pg_ctl sends its output there, the entrypoint redirects nothing),
          # and `listen_addresses=''` still leaves it on the usual unix socket,
          # which is the one pg_isready and `docker exec psql` both use. So
          # BOTH halves of the old condition were satisfiable by the very
          # server this loop exists to skip past, and the wait was decorative.
          #
          # "PostgreSQL init process complete; ready for start up." is echoed
          # by the entrypoint script itself, after docker_temp_server_stop has
          # returned. It is the one line in the stream the temp server cannot
          # produce, which is why the old comment already named it -- the code
          # just never matched it. -F because the banner contains regex
          # metacharacters and is a fixed string, not a pattern.
          ready=no
          for i in $(seq 1 60); do
            if docker logs pg-smoke 2>&1 | grep -qF "PostgreSQL init process complete; ready for start up." \
               && docker exec pg-smoke pg_isready -U postgres >/dev/null 2>&1; then
              ready=yes
              echo "real server accepting connections after ${i}s"
              break
            fi
            sleep 1
          done
          # The old loop fell through on timeout and let the psql calls fail
          # instead, which is how this arrived as "FATAL: the database system
          # is shutting down" with no container log to read -- the failure that
          # gets reported is then a symptom of the wait, not the wait itself.
          if [ "$ready" != yes ]; then
            echo "FAILED: PostgreSQL never finished starting within 60s"
            docker logs pg-smoke
            exit 1
          fi
          docker exec pg-smoke psql -U postgres -tAc "SHOW max_connections;"      | grep -qx 20
          docker exec pg-smoke psql -U postgres -tAc "SHOW effective_cache_size;" | grep -qx 512MB
          docker exec pg-smoke psql -U postgres -tAc "SHOW archive_mode;"         | grep -qx on
          echo "tuning applied"
          docker rm -f pg-smoke
