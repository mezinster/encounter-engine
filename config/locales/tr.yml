# Turkish.
#
# Registered on 2026-08-09 and translated in the same programme -- see
# docs/superpowers/plans/2026-08-09-locale-translation-delivery.md.
#
# MACHINE-PRODUCED, NOT REVIEWED BY A NATIVE SPEAKER. The same status uk, ka,
# be and pl carry (see CLAUDE.md). Structurally verified -- every key in
# ru.yml has a value here, every interpolation variable matches -- but the
# wording has not been read by anyone who speaks Turkish. This locale needed
# more restructuring than the others, so it is the one where an unreviewed
# translation is most likely to read oddly. Treat reported wording problems as
# real.
#
# ---------------------------------------------------------------------------
# THE RULE THAT SHAPED THIS FILE: never attach a suffix to a placeholder.
# ---------------------------------------------------------------------------
#
# Turkish is agglutinative. "to the team X" attaches a case suffix to X, and
# WHICH suffix depends on X's last vowel (vowel harmony) and whether it ends
# in a consonant -- a team called "Ada" and one called "Kadıköy" take
# different endings. No template can choose correctly, and the value here is a
# name a player typed.
#
# So every one of the 37 keys carrying a user-authored value (%{team},
# %{nickname}, %{game}, %{name}, %{level}, %{answer}, ...) is worded so the
# suffix lands on a COMMON NOUN that is part of the template -- usually via
# "«%{team}» adlı takım" (the team named X) rather than "%{team}'a". ka.yml
# solved the same problem the same way; see the note in CLAUDE.md about
# Georgian moving the case suffix onto a preceding common noun.
#
# To check this after editing: render a key with a consonant-final name and a
# vowel-final one. If only one reads naturally, the template is inflecting
# around the placeholder again.
#
# The i/İ hazard is handled elsewhere and needs no help here: both layouts set
# <html lang="<%= I18n.locale %>">, so the five text-transform:uppercase rules
# get Turkish casing from the browser. The rule to keep is never to add a
# Ruby-side .upcase/.downcase on user-facing text -- that is locale-blind and
# would turn "i" into "I" instead of "İ".
#
# Game jargon, applied consistently: игра -> oyun, команда -> takım,
# задание -> görev (the puzzle a level poses), уровень -> seviye (its numbered
# position), код -> kod (the answer string players find in the city),
# подсказка -> ipucu, игрок -> oyuncu, заявка -> başvuru, "сойти с дистанции"
# -> "yarıştan çekilmek" (quit mid-game).
