        %{url}

        ბმული მოქმედებს %{hours} საათის განმავლობაში. თუ თქვენ არ მოგითხოვიათ
        პაროლის განულება, უბრალოდ დააიგნორეთ ეს წერილი — თქვენი პაროლი
        უცვლელი დარჩება.
