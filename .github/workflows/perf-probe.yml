# An instrument you invoke, not a monitor on a schedule.
#
# It answers "how does this host shape, with this game, at this arrival rate,
# actually perform" and commits a record that can still be compared months
# later. It NEVER resizes anything -- see the design's section 3.1 for why
# observation was chosen over on-demand resizing.
#
# The motivating measurement, 2026-08-21 against production on a Standard_B1ms:
# 120 teams arriving over 22 minutes gave p95 196ms; the same 120 arriving over
# 30 seconds gave p95 5860ms. Zero errors in both. A record holding only the
# number would have been misleading within a month, which is why every parameter
# that could explain a difference is captured at the moment of the run.
#
# Design: docs/superpowers/specs/2026-08-22-perf-probe-design.md
name: Performance probe

on:
  workflow_dispatch:
    inputs:
      source_game:
        description: "Source game id to clone"
        type: string
        required: true
      teams:
        description: "Teams to seed"
        type: string
        default: "120"
      scenario:
        description: "Which question to ask"
        type: choice
        default: stampede
        options: [stampede, ramp, hold]
      stampede_window:
        # The question the probe exists to answer, made dispatchable. main.js
        # has read STAMPEDE_WINDOW since it was written; nothing could set it.
        #
        # 120 teams over 30s is 4 logins/s, and a bcrypt-cost-12 verify is
        # ~254ms of single core, so arrivals alone offer ~1.02 cores to a
        # 1-vCPU host. Utilisation at ~1.0 is why run 33066075206 read p95
        # 5.65s with ZERO errors and every check passing -- a queue, not a
        # fault. Widening this window divides the arrival rate, so it is the
        # one knob that tests that explanation and, if it holds, says how fast
        # teams may actually arrive on a game night.
        #
        # Ignored by `ramp` and `hold`, which set their own pacing.
        description: "Stampede only: how long the teams take to arrive"
        type: string
        default: "30s"
      generator:
        description: "Where load comes from"
        type: choice
        default: runner
        options: [runner, vm]
      note:
        description: "Free text, e.g. 'before the Postgres tuning'"
        type: string
        default: ""

permissions:
  contents: write        # pushes the record's branch
  pull-requests: write   # opens the pull request that lands it on master
  id-token: write        # OIDC to Azure, for the NSG hole and the host facts

# Two probes at once would seed two cohorts, and the seeder's advisory lock
# would refuse the second mid-workflow rather than politely queueing it.
concurrency:
  group: perf-probe
  cancel-in-progress: false

env:
  APP_HOST: game.mezin.eu
  RG: MEZINEU
  VM: web
  SSH_HOST: 23.100.7.86
  SSH_USER: mezinster

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Required, not merely cautious, and for two separate reasons. Every secret
    # this job needs -- SSH_PRIVATE_KEY, AZURE_CLIENT_ID, AZURE_TENANT_ID,
    # AZURE_SUBSCRIPTION_ID -- lives on the `production` environment, not on the
    # repository; outside the environment `secrets.X` is the empty string with
    # no warning, and the first step that validates its input is the one that
    # reports the failure. And `ee-deploy-oidc` trusts exactly one federated
    # subject,
    # repo:mezinster@10500786/encounter-engine@1322568945:environment:production
    # -- so `azure/login` could not work here either. Same reasoning, same
    # wording, as database.yml.
    #
    # This settles open question 1 of the design (section 9): the gate is not a
    # policy choice about seeding hundreds of production rows, it is the only
    # configuration in which this workflow can reach production at all. The
    # approval click is the price, and it is charged once per probe.
    environment: production

    steps:
      # v7.0.1, the SHA the other eleven checkout steps in this repo use. The
      # v4.2.2 pin this replaced declares `using: node20` in its action.yml
      # (verified), which is what produced the "Node 20 is being deprecated"
      # notice on every run of this workflow. v7.0.1 declares node24.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Was v1.245.0, whose Ruby catalogue stops at 3.3.8 -- so this step could
      # never have succeeded with the 3.3.12 requested below. It failed with
      # "Unknown version 3.3.12 for ruby on ubuntu-24.04" the first time it was
      # actually reached. This workflow is dispatched by hand and had not been
      # run, so the breakage sat here unnoticed; it surfaced only when
      # smtp-probe.yml copied this pin and then ran on a schedule.
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.3.12"

      # The cohort id is generated BEFORE anything is seeded and exported
      # immediately, so the always() teardown below knows what to remove even if
      # seeding itself fails halfway through. Whether that teardown RUNS is a
      # separate question, answered by COHORT_SEEDED, which the seed step writes
      # on its first line -- knowing the name of a cohort is not evidence that
      # one was created.
      - name: Generate the cohort id
        run: |
          echo "COHORT=lt-$(date -u +%Y-%m-%dT%H%M)-probe" >> "$GITHUB_ENV"
          echo "AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      # BEFORE the cohort is seeded, the generator is provisioned or the NSG is
      # touched -- which is the entire point of its position in this file.
      #
      # ci.yml runs the same check on every push and pull request, so a script
      # that reaches here is usually already known to be sound. Usually is not
      # always: this workflow is `workflow_dispatch`, so it can be dispatched
      # from any ref, including a branch whose CI has not finished or has never
      # run. The cost of being wrong is asymmetric enough to pay for the twelve
      # seconds -- by the time k6 would otherwise have complained, 120 accounts
      # exist in production, a VM is running in westeurope and port 22 is open
      # to this runner.
      - name: Install k6
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://github.com/grafana/k6/releases/download/v0.52.0/k6-v0.52.0-linux-amd64.tar.gz \
            | tar xz --strip-components=1 -C "$HOME/.local/bin" k6-v0.52.0-linux-amd64/k6
          chmod +x "$HOME/.local/bin/k6"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check the load-test script before anything is created
        run: bin/check-load-test-script

      - name: Load the deploy SSH key
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # Read from the host itself over an already-trusted session, not scanned
      # from the network -- ssh-keyscan trusts whatever answers. Same key and
      # same reasoning as deploy.yml; if it stops matching, the host was rebuilt.
      - name: Pin the host key
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo '23.100.7.86 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBESJGNohuozwA1DTg1Tjlghw/G0krguiE0Enw5BfMew' >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # TWO Azure identities, in this order, and the order is the point.
      #
      # ee-deploy-oidc -- the one the rest of this job runs under -- holds
      # exactly one role assignment: Network Contributor on webNSG. It cannot
      # read the VM, and it should not be able to: it is the identity that can
      # open port 22, so it is the one worth keeping thin. host_facts.sh needs
      # Reader and Monitoring Reader on `web`, which is precisely and only what
      # ee-vmscale-reader-oidc already holds for vm-scale.yml.
      #
      # Run 33062376105 reported this step green while its very first `az vm
      # show` returned AuthorizationFailed -- see the host-facts step below for
      # how a green tick hid that -- so the facts had never once been gathered.
      #
      # Host facts are Azure API reads and need no SSH hole, so they run BEFORE
      # the NSG is touched. That is what lets one job use two identities without
      # either of them being logged in while the other's work happens.
      - name: Authenticate to Azure (read-only identity)
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ secrets.AZURE_VMSCALE_READER_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # BEFORE load. cpu_credits_remaining_start means the balance the run
      # started with; reading it afterwards would record the balance the run
      # itself produced, which is a different fact wearing the same name.
      #
      # Redirected, NOT piped through `tee`. The step shell is `bash -e` without
      # `pipefail`, so `host_facts.sh | tee host.json` exits with tee's status:
      # in run 33062376105 the script aborted on its first az call and the step
      # went green in three seconds, leaving an empty host.json for
      # Perf::BuildRecord to read. A record asserting host facts that were never
      # gathered is worse than a failed run, and is the exact thing this
      # script's own "absent data is never read as reassuring" comment exists to
      # prevent. `> file` then `cat` keeps the log output without the pipe.
      - name: Gather the host shape and credit standing
        run: |
          ./ops/perf/host_facts.sh > host.json
          cat host.json

      - name: Authenticate to Azure (deploy identity, for the NSG)
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # The NSG restricts port 22 to a short allowlist and GitHub runners are in
      # none of it. Each run opens 22 to its own address and closes it again in
      # the always() step at the end -- the same just-in-time hole deploy.yml
      # punches, for the same reason.
      - name: Open SSH to this runner only
        run: |
          RUNNER_IP=$(curl -fsS --max-time 10 https://api.ipify.org || curl -fsS --max-time 10 https://ifconfig.me)
          [ -n "$RUNNER_IP" ] || { echo "could not determine runner IP"; exit 1; }
          echo "opening 22 for ${RUNNER_IP}/32"
          # Handed to the wait step below, which needs it to say something
          # useful when port 22 never answers. deploy.yml keeps the same
          # variable for its run summary, and for the same reason it is NOT
          # called RUNNER_IP: the GITHUB_ and RUNNER_ prefixes are reserved for
          # Actions' own use and a $GITHUB_ENV line claiming one is discarded
          # silently.
          echo "JIT_SOURCE_IP=${RUNNER_IP}" >> "$GITHUB_ENV"
          # Set BEFORE the create, not after: `az` can fail having already made
          # the rule, and a hole left open in the NSG is a worse outcome than a
          # delete that finds nothing. The teardown step below reads this.
          echo "NSG_RULE_OPEN=1" >> "$GITHUB_ENV"
          # Retried for the reason deploy.yml's identical step spells out at
          # length: the Azure CLI is flaky here, not this command. Under Python
          # 3.14 azure.cli.core imports across threads and that path deadlocks
          # on _ModuleLock (Azure/azure-cli#32980).
          #
          # This step is where that bug was hit a SECOND time, in run
          # 33061481727, with `_frozen_importlib._DeadlockError` raised from the
          # LRO poller thread inside msal's `import requests  # Lazy load` --
          # while `az network nsg rule delete` in the cleanup step of the same
          # job succeeded on its first attempt, which is the tell that it is a
          # race. deploy.yml grew this loop when it was hit the first time; the
          # probe copied the command out of that step without it.
          for attempt in 1 2 3 4 5; do
            if az network nsg rule create \
                 --resource-group mezineu --nsg-name webNSG \
                 --name "perf-jit-${{ github.run_id }}" \
                 --priority 901 --direction Inbound --access Allow --protocol Tcp \
                 --source-address-prefixes "${RUNNER_IP}/32" \
                 --destination-port-ranges 22 \
                 --description "JIT SSH for perf probe run ${{ github.run_id }}" \
                 --output none; then
              echo "rule created on attempt ${attempt}"
              exit 0
            fi
            echo "attempt ${attempt} failed; retrying in 10s"
            sleep 10
          done
          echo "could not open port 22 after 5 attempts"
          exit 1

      # Azure applies an NSG change asynchronously, and this workflow is the
      # only one here that SSHes IMMEDIATELY after opening the hole --
      # deploy.yml has a Docker build and push between the two, so it has never
      # had to care. Run 33062376105 died in the step below with
      # `ssh: connect to host 23.100.7.86 port 22: Connection timed out`, three
      # seconds after `rule created on attempt 1`.
      #
      # Waiting on the CONDITION rather than sleeping a guessed interval, and
      # printing how long it took, because that number is the evidence the
      # failed run could not produce. Two hypotheses survived the investigation
      # -- propagation lag, or a rule written for an address that is not this
      # runner's SSH egress -- and they are told apart by whether this ever
      # succeeds and after how long. If it does not, the error names the address
      # so the next reader is not left guessing again.
      - name: Wait for port 22 to answer
        run: |
          start=$SECONDS
          for attempt in $(seq 1 30); do
            if timeout 5 bash -c "cat < /dev/null > /dev/tcp/${SSH_HOST}/22" 2>/dev/null; then
              echo "port 22 answered after $((SECONDS - start))s (attempt ${attempt})"
              exit 0
            fi
            sleep 5
          done
          echo "::error::port 22 on ${SSH_HOST} never answered in $((SECONDS - start))s"
          echo "::error::the JIT rule was opened for ${JIT_SOURCE_IP}/32 -- if that is not this runner's SSH egress address then the rule is wrong, not slow"
          exit 1

      - name: Seed the cohort
        run: |
          set -euo pipefail
          # Marks "rows may exist in production from here on". Written before the
          # seeder runs, so a seed that dies halfway is still torn down -- which
          # is the case the COHORT export near the top of this job exists for.
          # What it does NOT do is fire when this step never ran at all: a
          # failure before it (no SSH key, no Azure, no runner IP) used to end
          # with a red "TEARDOWN DID NOT COMPLETE" naming a cohort that was
          # never created, and an alarm that cries wolf is one nobody reads on
          # the day it is real.
          echo "COHORT_SEEDED=1" >> "$GITHUB_ENV"
          ssh -o ConnectTimeout=30 "${SSH_USER}@${SSH_HOST}" \
            "C=\$(docker ps --format '{{.Names}}' | grep encounter-engine-web)
             docker exec -e LOAD_TEST_COHORT='${COHORT}' -e LOAD_TEST_CONFIRM='${COHORT}' \
               -e LOAD_TEST_BASE_URL='https://${APP_HOST}' \
               \"\$C\" bin/rails 'load_test:seed[${{ inputs.source_game }},${{ inputs.teams }}]' >/dev/null
             docker exec \"\$C\" cat /tmp/${COHORT}.json" > manifest.json
          chmod 600 manifest.json
          # Never echoed, never an artifact: it holds a live password for every
          # seeded captain and every answer code in the source game.
          ruby -rjson -e '
            m = JSON.parse(File.read("manifest.json"))
            abort("manifest has no teams") if m["teams"].to_a.empty?
            abort("manifest points at #{m["base_url"]}") unless m["base_url"].to_s.start_with?("https://")
            File.write("game.json", JSON.generate("id" => m["game_id"], "levels" => m["codes"].size))
            puts "seeded #{m["teams"].size} teams across #{m["codes"].size} levels"'

      # No continue-on-error. A result with no baseline cannot be compared to
      # anything and is not worth the traffic it would cost to produce.
      #
      # Gated on `runner`, which it never was. This step runs HERE, on the
      # GitHub runner, three steps before the vm generator is provisioned -- so
      # for `generator: vm` it measured the runner's network and the record
      # filed it under `"generator": {"kind": "vm", "region": "westeurope"}`.
      # Run 33078663339 recorded 133.8ms for a generator sharing a region with
      # the app; baseline.sh's own header puts that figure at 13.5ms and says
      # in as many words that the two are "not the same measurement".
      #
      # Nothing raised. README.md tells the reader to subtract the baseline,
      # and following that instruction would have subtracted 134ms of latency
      # the run never paid -- and hidden the entire benefit the vm generator
      # exists to provide. The vm path measures its own, on the generator,
      # below.
      #
      # Redirected rather than piped through `tee`, for the reason the
      # host-facts step above spells out: the step shell is `bash -e` with no
      # `pipefail`, so a pipeline exits with tee's status and this script's
      # deliberate non-zero exit would be discarded.
      - name: Measure the runner's baseline
        if: inputs.generator == 'runner'
        run: |
          ./ops/perf/baseline.sh "https://${APP_HOST}/up" > baseline.json
          cat baseline.json

      # An aborted run is a RESULT the record must capture, not a build failure.
      # This is the only step in the workflow allowed to continue on error.
      - name: Run k6 from the runner
        if: inputs.generator == 'runner'
        continue-on-error: true
        run: |
          # See "Fail if no load was generated at all" below. Written on the
          # line before k6 is invoked, so it distinguishes "k6 ran and died"
          # from "we never got as far as k6".
          echo "K6_STARTED=1" >> "$GITHUB_ENV"
          # Wall time around k6 alone, not around the step. This is what tells a
          # later reader whether a run was cut short -- see the K6_SECONDS
          # comment on the vm generator below, which explains why the record
          # could not say so before.
          K6_T0=$(date +%s)
          k6 run --summary-export summary.json \
            --env PHASE=${{ inputs.scenario }} \
            --env TEAMS=${{ inputs.teams }} \
            --env STAMPEDE_WINDOW=${{ inputs.stampede_window }} \
            --env BASE_URL="https://${APP_HOST}" \
            --env MANIFEST="$PWD/manifest.json" \
            load_test/main.js || true
          # `|| true` so the two lines below still run, matching what the vm
          # generator already does. Without it the step shell's `-e` exits the
          # moment k6 returns non-zero -- which is precisely a run that crossed
          # a threshold, so `duration_s` would have gone missing in the one case
          # it exists to describe. The step is `continue-on-error` either way;
          # what changes is only whether these two lines are reached.
          echo "K6_SECONDS=$(( $(date +%s) - K6_T0 ))" >> "$GITHUB_ENV"
          echo "GEN_REGION=" >> "$GITHUB_ENV"

      - name: Run k6 from a westeurope generator
        if: inputs.generator == 'vm'
        continue-on-error: true
        run: |
          set -euo pipefail
          ./load_test/provision.sh create

          # `az vm show`, not the old `awk '/PublicIpAddress/{getline; getline;
          # print $3}' provision.log`, which read a column position out of
          # `--output table` -- human-facing text that az is free to re-align
          # in any release. Asking for the one field is both shorter and
          # immune to that.
          IP="$(az vm show -d -g encounter-loadgen -n loadgen --query publicIps -o tsv)"
          [ -n "$IP" ] || { echo "::error::generator has no public IP"; exit 1; }
          echo "generator at ${IP}"

          # `--generate-ssh-keys` in provision.sh wrote a fresh throwaway
          # keypair to ~/.ssh/id_rsa and injected the public half into the VM.
          # It is NOT the deploy key, which is the one loaded into the agent --
          # so say which key to use rather than letting ssh work through the
          # agent's offering first.
          SSHOPTS="-o StrictHostKeyChecking=accept-new -o ConnectTimeout=30"
          SSHOPTS="${SSHOPTS} -o IdentitiesOnly=yes -i ${HOME}/.ssh/id_rsa"

          # provision.sh opens the generator's own NSG to this runner as its
          # last act, and an NSG change is applied asynchronously -- 64 seconds
          # of it in run 33064139352, against the production host. Measured
          # 2026-08-27 the VM's own ~46s build usually covers the propagation
          # here, but "usually" is not a guarantee worth a failed provision.
          start=$SECONDS
          for attempt in $(seq 1 30); do
            if timeout 5 bash -c "cat < /dev/null > /dev/tcp/${IP}/22" 2>/dev/null; then
              echo "generator port 22 answered after $((SECONDS - start))s (attempt ${attempt})"
              break
            fi
            [ "$attempt" = 30 ] && { echo "::error::generator port 22 never answered"; exit 1; }
            sleep 5
          done

          # sshd answering does not mean the box is ready. cloud-init runs
          # `package_update: true` and then downloads k6 from GitHub, and
          # measured directly on 2026-08-27 the k6 binary appeared 23 SECONDS
          # after provision.sh returned. The old code scp'd and ran `k6` at
          # once, racing that install -- winning or losing by however long the
          # copy happened to take.
          # `--wait` blocks until cloud-init has finished, and blocking is the
          # ONLY thing this line is for. Its exit code answers a different
          # question and is not one worth failing on: 0 is done, 1 is error,
          # and 2 is "done, but some module logged a recoverable error".
          #
          # Run 33090016701 hit the 2. cloud-init printed `status: done` and
          # exited 2 anyway, and `set -e` killed the step 50ms later -- before
          # the next line could ask the question that actually matters. No
          # record was written, which was the guard below working correctly on
          # a failure that should never have been one.
          #
          # A degraded cloud-init that installed k6 is fine here; a spotless one
          # that did not is not; and only `k6 version` separates them. So block
          # on the wait, report the code, and let the next line be the
          # assertion. The cause of that particular 2 was never reproduced --
          # two generators built afterwards came up clean -- so this does not
          # depend on knowing it.
          ci_rc=0
          ssh ${SSHOPTS} "azureuser@${IP}" 'cloud-init status --wait' || ci_rc=$?
          [ "$ci_rc" = 0 ] || echo "::warning::cloud-init exited ${ci_rc} (2 = finished with recoverable errors); k6 is checked next"
          ssh ${SSHOPTS} "azureuser@${IP}" 'k6 version'

          # The generator's own baseline, measured FROM the generator and
          # before any load -- the same script the runner path uses, so the two
          # numbers mean the same thing and differ only by where they were
          # taken. `bash <file>` rather than executing it, because scp does not
          # carry the mode bit without -p.
          #
          # Ahead of the K6_STARTED marker deliberately: baseline.sh exits
          # non-zero when it cannot measure, and its header is explicit that a
          # result with no baseline is not worth producing. Failing here aborts
          # the step before the marker, so the guard below refuses to write a
          # record at all rather than writing one nothing can be compared to.
          scp ${SSHOPTS} ops/perf/baseline.sh "azureuser@${IP}:~/baseline.sh"
          ssh ${SSHOPTS} "azureuser@${IP}" \
            "bash ~/baseline.sh 'https://${APP_HOST}/up'" > baseline.json
          cat baseline.json

          scp ${SSHOPTS} manifest.json "azureuser@${IP}:~/manifest.json"
          scp -r ${SSHOPTS} load_test "azureuser@${IP}:~/"
          # Deliberately after the scps and before the ssh: reaching this line
          # means a generator exists, is ready, and is holding the test.
          # Everything above runs under `set -euo pipefail` with no `|| true`,
          # so a generator that was never provisioned -- run 33064139352 --
          # aborts the step before the marker is written, which is exactly the
          # distinction the guard step below needs.
          echo "K6_STARTED=1" >> "$GITHUB_ENV"
          # How long k6 ACTUALLY ran, recorded as run.duration_s. A k6 summary
          # is written both by a run that reached its planned end and by one
          # `abortOnFail` killed mid-flight, and nothing inside it separates
          # them -- so before this existed, `outcome` guessed, and guessed wrong
          # for every `hold` run: those set `abortOnFail: false`, so no
          # threshold can cut one short, yet a crossed `checks` threshold filed
          # the 40-minute run of 2026-08-27 as "aborted". 2430 against a planned
          # 40 minutes says it ran; 32 against a 30s stampede says it did not.
          #
          # Timed around the ssh, which is as close to k6 as this side can get.
          # It therefore includes ssh setup -- a second or two against runs
          # measured in minutes, and erring long, which is the safe direction:
          # it can never make a completed run look truncated.
          K6_T0=$(date +%s)
          ssh ${SSHOPTS} "azureuser@${IP}" \
            "k6 run --summary-export summary.json \
               --env PHASE=${{ inputs.scenario }} --env TEAMS=${{ inputs.teams }} \
               --env STAMPEDE_WINDOW=${{ inputs.stampede_window }} \
               --env BASE_URL=https://${APP_HOST} --env MANIFEST=/home/azureuser/manifest.json \
               load_test/main.js" || true
          echo "K6_SECONDS=$(( $(date +%s) - K6_T0 ))" >> "$GITHUB_ENV"
          scp ${SSHOPTS} "azureuser@${IP}:~/summary.json" summary.json || true
          echo "GEN_REGION=westeurope" >> "$GITHUB_ENV"

      # `continue-on-error` on the two generator steps above is there so that k6
      # ABORTING is recorded as a result rather than failing the build -- a run
      # that fell over under load is the most interesting thing this workflow
      # can find. It was never meant to hide a generator that never started.
      #
      # Run 33064139352 could not tell those apart. provision.sh died on an
      # authorisation error, k6 never ran, no summary was written, a record was
      # committed reading `"outcome": "errored"`, and the job reported SUCCESS
      # -- after seeding 120 real accounts into production. Read months later,
      # that record says the app errored under a 120-team stampede on a B1ms.
      # The app was never asked. That is worse than no record, which is why this
      # runs BEFORE the record is built rather than annotating it afterwards.
      #
      # K6_STARTED is written by whichever generator step got as far as
      # invoking k6. Absent, the instrument never ran: a build failure, and a
      # fact about this workflow rather than about production. Present with no
      # summary.json, k6 died on its own terms -- a crash, a startup guard
      # refusing, an unreachable host -- and that IS a result, recorded as
      # "errored" exactly as the step below intends.
      - name: Fail if no load was generated at all
        if: env.K6_STARTED != '1'
        run: |
          echo "::error::No load was generated: the '${{ inputs.generator }}' generator never reached k6."
          echo "::error::The cohort was seeded and has been torn down, and no measurement exists."
          echo "::error::No record is written for this run, because a record would claim the app was tested."
          echo "::error::Read the generator step above, not the application."
          exit 1

      # The other half of the credit story, and the half `hold` was built to
      # ask for. The reading taken before the run says what the bank held; only
      # a second reading says what the run COST -- and version 2 of the record
      # had no field for it, so the 40-minute run of 2026-08-27 could not answer
      # its own question. That answer (287.5 of 288 at its lowest, back to 288.0
      # by the end) had to be recovered from Azure by hand the next day, and
      # metric retention is 93 days against a record meant to last years.
      #
      # THREE steps, and the third is not optional. `azure/login` replaces the
      # CLI session, so reading as ee-vmscale-reader-oidc leaves the job holding
      # the wrong identity for its own teardown -- and "Close SSH again" failing
      # would leave port 22 open to a runner address, which is a worse outcome
      # than any missing measurement. Hence: both reading steps are
      # `continue-on-error` (a missing reading is null, which the record already
      # states honestly), and the re-authentication is `always()` so it restores
      # the deploy identity even when they fail.
      - name: Authenticate to Azure (read-only identity, for the after reading)
        if: env.K6_STARTED == '1'
        continue-on-error: true
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ secrets.AZURE_VMSCALE_READER_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Read what the run cost the credit bank
        if: env.K6_STARTED == '1'
        continue-on-error: true
        run: |
          RUN_SECONDS="${K6_SECONDS:-0}" ./ops/perf/host_facts.sh after > host_after.json
          cat host_after.json

      - name: Re-authenticate to Azure (deploy identity, for the teardown)
        if: always()
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and commit the record
        run: |
          set -euo pipefail
          ruby -rjson -rfileutils -e '
            require_relative "ops/perf/build_record"
            # summary.json is absent when k6 died before writing one -- a crash,
            # a startup guard refusing, an unreachable host. Still a fact about
            # this host and this game on this date, recorded as "errored".
            summary = File.exist?("summary.json") ? JSON.parse(File.read("summary.json")) : nil
            region  = ENV["GEN_REGION"].to_s
            record  = Perf::BuildRecord.new(
              :summary   => summary,
              # host.json is the shape and the balance BEFORE; host_after.json
              # is what the run cost. Absent when the reading failed or k6 never
              # ran, and absent is correct -- the keys are simply missing rather
              # than present and lying.
              :host      => JSON.parse(File.read("host.json")).merge(
                              File.exist?("host_after.json") ?
                                JSON.parse(File.read("host_after.json")) : {}),
              :generator => JSON.parse(File.read("baseline.json")).merge(
                              "kind"   => ENV["GENERATOR"],
                              "region" => region.empty? ? nil : region),
              :game      => JSON.parse(File.read("game.json")),
              # duration_s is nil, not 0, when nothing measured it: absent data
              # is never read as reassuring, and a run recorded as lasting zero
              # seconds is a claim rather than a gap.
              :run       => { "at" => ENV["AT"], "note" => ENV["NOTE"],
                              "scenario" => ENV["SCENARIO"], "teams" => ENV["TEAMS"].to_i,
                              "stampede_window" => ENV["STAMPEDE_WINDOW"],
                              "duration_s" => ENV["K6_SECONDS"].to_s.empty? ? nil : ENV["K6_SECONDS"].to_i },
              :app       => { "sha" => ENV["GITHUB_SHA"][0, 7] })
            path = File.join("docs/perf/results", record.filename)
            FileUtils.mkdir_p(File.dirname(path))
            File.write(path, JSON.pretty_generate(record.to_h) + "\n")
            puts path
            puts JSON.pretty_generate(record.to_h["result"])
            File.write(ENV["GITHUB_ENV"], "RECORD=#{path}\n", mode: "a")'
        env:
          GENERATOR: ${{ inputs.generator }}
          SCENARIO: ${{ inputs.scenario }}
          TEAMS: ${{ inputs.teams }}
          STAMPEDE_WINDOW: ${{ inputs.stampede_window }}
          NOTE: ${{ inputs.note }}

      # `master` is protected -- pull requests required, enforce_admins on, and
      # no bypass allowances -- so a plain `git push` here is rejected. That
      # rejection would land AFTER the cohort has been seeded and the load has
      # been run, which is the most expensive point in the workflow at which to
      # discover it, and it would discard the one artefact the run exists to
      # produce. The record goes to its own branch and opens a pull request.
      #
      # Every input is read from the environment rather than interpolated into
      # the script, for the reason the step above already does it: `note` is
      # free text, and `${{ }}` splices it into the shell before bash sees a
      # quote.
      - name: Commit the record
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="perf-record/${GITHUB_RUN_ID}"
          TITLE="perf: ${SCENARIO}, ${TEAMS} teams over ${STAMPEDE_WINDOW}, game ${SOURCE_GAME}"
          [ "$SCENARIO" = "stampede" ] || TITLE="perf: ${SCENARIO}, ${TEAMS} teams, game ${SOURCE_GAME}"
          git checkout -b "$BRANCH"
          git add "$RECORD"
          git commit -m "$TITLE"
          git push -u origin "$BRANCH"
          {
            echo "Recorded by [run ${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})."
            echo
            echo '```json'
            cat "$RECORD"
            echo '```'
          } > pr-body.md

          # The branch is already pushed by this point, so the record is safe
          # whatever happens next -- opening the pull request is a convenience,
          # not the durability mechanism, and it must not be able to fail a run
          # whose result is already on the server.
          #
          # It CAN fail: the repository has "Allow GitHub Actions to create and
          # approve pull requests" off
          # (`can_approve_pull_request_reviews: false`, checked 2026-08-27), and
          # with it off `gh pr create` under GITHUB_TOKEN is refused outright.
          # Turning it on is a repository-wide grant covering the approve half
          # too, so it is the owner's call rather than this workflow's; until it
          # is made, the compare link below is one click from the same pull
          # request.
          if gh pr create --base master --head "$BRANCH" \
               --title "$TITLE" --body-file pr-body.md >pr.log 2>&1; then
            cat pr.log
            { echo "### Record"; echo; cat pr.log; } >> "$GITHUB_STEP_SUMMARY"
          else
            cat pr.log
            COMPARE="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/master...${BRANCH}?expand=1"
            echo "::warning::could not open the pull request automatically; the record is pushed to ${BRANCH}"
            {
              echo "### Record pushed to \`${BRANCH}\`"
              echo
              echo "Opening the pull request automatically was refused. [Open it here](${COMPARE})."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          SCENARIO: ${{ inputs.scenario }}
          TEAMS: ${{ inputs.teams }}
          STAMPEDE_WINDOW: ${{ inputs.stampede_window }}
          SOURCE_GAME: ${{ inputs.source_game }}

      # Every exit path from the seed step onward, including cancellation. A
      # silent failure here leaves hundreds of accounts in production, which is
      # why it exits non-zero and prints the manual recovery command rather than
      # warning.
      - name: Tear down the cohort
        if: always() && env.COHORT_SEEDED == '1'
        run: |
          set -uo pipefail
          ssh -o ConnectTimeout=30 "${SSH_USER}@${SSH_HOST}" \
            "C=\$(docker ps --format '{{.Names}}' | grep encounter-engine-web)
             docker exec -e LOAD_TEST_CONFIRM='${COHORT}' \"\$C\" \
               bin/rails 'load_test:teardown[${COHORT}]'
             docker exec \"\$C\" bin/rails load_test:status" | tee teardown.log
          if ! grep -q ':cohort_id=>nil' teardown.log; then
            echo "::error::TEARDOWN DID NOT COMPLETE for ${COHORT}. Recover with:"
            echo "::error::ssh ${SSH_USER}@${SSH_HOST} \"docker exec -e LOAD_TEST_CONFIRM=${COHORT} <container> bin/rails 'load_test:teardown[${COHORT}]'\""
            exit 1
          fi

      # Fails the job rather than warning, matching the cohort teardown above.
      # `provision.sh destroy` now asserts the group is empty and exits non-zero
      # with THEY ARE BILLING if it is not, and downgrading that to a warning
      # would be the same false green this workflow spent a day removing: a run
      # reporting success while a VM it created keeps charging. The generator
      # also holds the manifest, which carries a live password for every seeded
      # captain and every answer code in the source game.
      - name: Destroy the generator
        if: always() && inputs.generator == 'vm'
        run: ./load_test/provision.sh destroy

      - name: Close SSH again
        if: always() && env.NSG_RULE_OPEN == '1'
        run: |
          for attempt in 1 2 3 4 5; do
            az network nsg rule delete --resource-group mezineu --nsg-name webNSG \
              --name "perf-jit-${{ github.run_id }}" --output none 2>/dev/null && exit 0
            echo "cleanup attempt ${attempt} failed; retrying in 10s"
            sleep 10
          done
          echo "::error::could not remove the JIT NSG rule perf-jit-${{ github.run_id }} -- remove it by hand"
          exit 1

      # summary.json ONLY. Never manifest.json.
      - name: Upload the k6 summary
        if: always()
        # v7.0.1. The v4.6.2 pin this replaced declared `using: node20`, which is
        # the deprecation GitHub now warns about on every run. Every major from
        # v5 to v7 is a runtime bump plus additive inputs -- v5 and v6 moved to
        # Node 24, v7 added an optional `archive:` and switched the package to
        # ESM internally. The three inputs used below are unchanged throughout.
        #
        # The one caveat in those release notes -- a minimum runner of 2.327.1 --
        # applies to SELF-HOSTED runners. This job is `runs-on: ubuntu-latest`,
        # so GitHub keeps the runner current.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: k6-summary-${{ github.run_id }}
          path: summary.json
          if-no-files-found: warn
