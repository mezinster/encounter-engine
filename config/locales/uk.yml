# Ukrainian.
#
# Registered per the project owner's task-12 decision: the platform's target
# language set is en, ru, uk and ka. uk was originally "registered now,
# translate later" -- present in config.i18n.available_locales
# (config/application.rb) with only the language-switcher endonyms filled in.
# It is now fully translated: every key in ru.yml has a Ukrainian value here,
# so config.i18n.fallbacks ([:ru], config/application.rb) is no longer
# exercised for this locale in practice. spec/i18n_spec.rb still permits a
# partial file (it asserts subset-of-ru, not equality) -- that relaxation is
# deliberate and stays, it simply no longer bites.
#
# Translated from ru.yml, cross-checked against en.yml. Game jargon follows
# the Russian consistently: задание -> завдання (the puzzle a level poses),
# уровень -> рівень (the numbered position in the game), код -> код (the
# answer string players find in the city), подсказка -> підказка,
# "сойти с дистанции" -> "зійти з дистанції" (quit mid-game).
