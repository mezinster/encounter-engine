# Polish.
#
# Registered on 2026-08-09 and translated in the same programme -- see
# docs/superpowers/plans/2026-08-09-locale-translation-delivery.md.
#
# MACHINE-PRODUCED, NOT REVIEWED BY A NATIVE SPEAKER. The same status uk, ka
# and be carry (see CLAUDE.md). Structurally verified -- every key in ru.yml
# has a value here, every interpolation variable matches -- but the wording
# has not been read by anyone who speaks Polish. Treat reported wording
# problems as real.
#
# Translated from ru.yml, cross-checked against en.yml. Game jargon follows
# the Russian consistently: игра -> gra, команда -> drużyna, задание ->
# zadanie (the puzzle a level poses), уровень -> poziom (its numbered
# position), код -> kod (the answer string players find in the city),
# подсказка -> podpowiedź, игрок -> gracz, заявка -> zgłoszenie, "сойти с
# дистанции" -> "zrezygnować z gry" (quit mid-game).
#
# Polish inflects around interpolated names the way Russian does -- «%{team}»
# in a sentence wanting the genitive reads slightly off. It is not a blocker
# (Russian ships with the same issue), but where a phrasing could avoid
# inflecting around a name, it does: "drużyny «%{team}»" is written as
# "drużyny o nazwie «%{team}»" nowhere -- instead the quoted name is kept in
# apposition after a common noun, which is grammatical whatever the name is.
