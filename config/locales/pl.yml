    countdown:
      # Three-element arrays indexed by the plural function hard-coded in
      # app/views/shared/_countdown.html.erb: [n%10==1 and n%100!=11,
      # n%10 in 2..4 and n%100 not in 12..14, everything else].
      #
      # That function is East Slavic, and Polish agrees with it everywhere
      # EXCEPT slot 0: it fires for 1, 21, 31, 101..., and Polish wants the
      # singular only for a bare 1 ("21 lat", not "21 rok"). So a countdown
      # standing at exactly 21/31/41 of a unit reads wrong here. The forms
      # below are the correct Polish three, chosen so the common cases (1, and
      # 2-4, and everything else) are right; fixing 21 needs a locale-aware
      # index function in that template, which is a code change and out of
      # scope for a translation. en.yml has had the same defect since it was
      # written ("21 year"), so this is a known shape, not a new one.
      prefix: "Pozostało: "
      years: ["rok", "lata", "lat"]
      months: ["miesiąc", "miesiące", "miesięcy"]
      days: ["dzień", "dni", "dni"]
      hours: ["godzina", "godziny", "godzin"]
      minutes: ["minuta", "minuty", "minut"]
      seconds: ["sekunda", "sekundy", "sekund"]
