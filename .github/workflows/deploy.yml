name: Deploy

on:
  workflow_dispatch:
    inputs:
      command:
        description: "kamal subcommand"
        type: choice
        options: [deploy, setup]
        default: deploy

# Two deploys at once would race on the just-in-time NSG rule below, and the
# second would delete the first's access mid-deploy.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      # Required for OIDC federation with Azure. `contents: read` must be stated
      # explicitly: naming any permission resets all the others to none.
      id-token: write
      contents: read

    # Every action below is pinned to a COMMIT SHA, not a tag, and only in this
    # workflow and database.yml -- the two that hold production secrets and can
    # reach the server. A tag like @v7 is mutable: whoever controls the action's
    # repository can repoint it, and the next deploy would silently run
    # different code with SECRET_KEY_BASE, the registry password and the SSH key
    # in its environment. A SHA cannot be repointed.
    #
    # The trailing comment is the human-readable version and is not decoration:
    # Dependabot parses it, and updates both the SHA and the comment together.
    #
    # ci.yml and images.yml stay on major tags on purpose. They hold no secrets,
    # publish nothing, and the churn of SHA bumps there would buy nothing.
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Ruby and gems
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          bundler-cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.KAMAL_REGISTRY_PASSWORD }}

      # Built, then TESTED, then pushed -- in three steps rather than one.
      #
      # `kamal deploy` does not touch accessories (kamal/cli/main.rb:21,
      # `def deploy(boot_accessories: false)`); only `kamal setup` does. So this
      # image is published on every deploy and picked up by nothing until
      # somebody runs `kamal setup` or `kamal accessory reboot db` -- which, per
      # docs/runbooks/restore.md, is the disaster-recovery path. An untested
      # image would sit in the registry looking healthy and fail at the worst
      # possible moment, so it is verified here before it is published at all.
      - name: Build the PostgreSQL image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.postgres
          load: true
          tags: ee-postgres:candidate

      # Same script images.yml runs on every push, so the two cannot drift.
      - name: Smoke-test the PostgreSQL image
        run: .github/scripts/smoke-postgres-image.sh ee-postgres:candidate

      - name: Push the PostgreSQL image
        run: |
          # Two tags for one image. config/deploy.yml:69 pins the accessory to
          # :latest, which is mutable -- on its own it leaves no known-good
          # version to go back to, unlike the app image, which kamal tags by
          # commit. The :$GITHUB_SHA tag is that rollback target: point the
          # accessory at it by hand if a published image turns out to be bad.
          repo=ghcr.io/mezinster/encounter-engine-postgres
          docker tag ee-postgres:candidate "${repo}:latest"
          docker tag ee-postgres:candidate "${repo}:${GITHUB_SHA}"
          docker push "${repo}:latest"
          docker push "${repo}:${GITHUB_SHA}"

      - name: Load the deploy SSH key
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Pin the host key
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # Read from the host itself over an already-trusted session, not
          # scanned from the network: ssh-keyscan trusts whatever answers, which
          # on a hostile path is the attacker. If this ever stops matching, the
          # host was rebuilt (or something is wrong) — do not "fix" it by
          # scanning; re-read /etc/ssh/ssh_host_ed25519_key.pub over a known-good
          # connection.
          echo '23.100.7.86 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBESJGNohuozwA1DTg1Tjlghw/G0krguiE0Enw5BfMew' >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # The NSG restricts port 22 to a short allowlist of source addresses, and
      # GitHub-hosted runners are in none of them — a deploy without the two
      # steps below dies with Net::SSH::ConnectionTimeout after ~136s, which
      # reads like a broken key but is a dropped packet.
      #
      # Rather than widening the allowlist permanently, each run opens 22 to its
      # own address and closes it again. Authentication is OIDC federation
      # against a user-assigned managed identity whose federated credential
      # trusts exactly one subject — and which holds Network Contributor on this
      # one NSG and nothing else. No Azure credential is stored in GitHub.
      #
      # That subject is NOT the plain repo:owner/name form this comment used to
      # claim. This repository has GitHub's immutable OIDC subject claims
      # enabled, so the real subject carries numeric IDs:
      #
      #   repo:mezinster@10500786/encounter-engine@1322568945:environment:production
      #
      # Azure matches the subject by exact string, so a credential registered in
      # the plain form matches nothing and fails only at the first real run,
      # with AADSTS70021: No matching federated identity record found. The
      # corrected form was found while setting up the VM scaling identities,
      # which were about to be registered wrongly by trusting this comment.
      # Read the live value rather than any comment:
      #   az identity federated-credential list --identity-name ee-deploy-oidc \
      #     -g MEZINEU --query "[].subject" -o tsv
      - name: Authenticate to Azure
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Open SSH to this runner only
        run: |
          RUNNER_IP=$(curl -fsS --max-time 10 https://api.ipify.org || curl -fsS --max-time 10 https://ifconfig.me)
          if [ -z "$RUNNER_IP" ]; then echo "could not determine runner IP"; exit 1; fi
          echo "opening 22 for ${RUNNER_IP}/32"
          # Handed to the summary step at the end of the job. Written before the
          # retry loop so a failure to create the rule still reports which
          # address we were trying to open.
          #
          # NOT exported as RUNNER_IP: the GITHUB_ and RUNNER_ prefixes are
          # reserved for Actions' own use and a $GITHUB_ENV line claiming one is
          # discarded, silently -- the summary step would just render an empty
          # cell. The local shell variable above can keep the obvious name.
          echo "JIT_SOURCE_IP=${RUNNER_IP}" >> "$GITHUB_ENV"
          # Retried because the Azure CLI itself is flaky here, not because the
          # command is: under Python 3.14 azure.cli.core loads command modules
          # across threads, and that concurrent import path deadlocks on
          # _ModuleLock (Azure/azure-cli#32980). Observed live -- this step died
          # with _frozen_importlib._DeadlockError while the identical
          # `az network nsg rule delete` in the cleanup step of the SAME job
          # succeeded, which is what identifies it as a race rather than a
          # misconfiguration. Without the retry, an upstream race fails a deploy.
          for attempt in 1 2 3 4 5; do
            if az network nsg rule create \
                 --resource-group mezineu --nsg-name webNSG \
                 --name "gha-jit-${{ github.run_id }}" \
                 --priority 900 --direction Inbound --access Allow --protocol Tcp \
                 --source-address-prefixes "${RUNNER_IP}/32" \
                 --destination-port-ranges 22 \
                 --description "JIT SSH for GitHub Actions run ${{ github.run_id }}" \
                 --output none; then
              echo "rule created on attempt ${attempt}"
              exit 0
            fi
            echo "attempt ${attempt} failed; retrying in 10s"
            sleep 10
          done
          echo "could not open port 22 after 5 attempts"
          exit 1

      # The same resolver the probe uses, so the two cannot disagree about which
      # vendor production is sending through. A bad MAIL_ROLE fails HERE, before
      # anything is deployed, rather than shipping mail pointed at nowhere.
      #
      # Deliberately NOT gated on `inputs.command == 'deploy'`, unlike the
      # verification steps below: `kamal setup` pushes the same env into the
      # container as `kamal deploy` does, and config/environments/production.rb
      # reads `ENV.fetch("SMTP_ADDRESS", "smtp.gmail.com")` -- `Hash#fetch`'s
      # default only fires on an ABSENT key. A `setup` run skipping this step
      # would still set SMTP_ADDRESS, just to "", which is present-and-empty,
      # not absent -- so the default would never kick in and the host would
      # boot with mail broken (address "", port 0) from its first deploy, with
      # nothing failing to say so. Don't re-add this gate for symmetry with the
      # steps below; it would reintroduce exactly that failure mode.
      - name: Resolve which SMTP vendor to ship
        id: mail
        env:
          MAIL_ROLE: ${{ vars.MAIL_ROLE }}
        run: |
          set -euo pipefail
          ruby ops/smtp/roles.rb

      - name: Deploy
        env:
          SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          SMTP_ADDRESS: ${{ steps.mail.outputs.live_host }}
          SMTP_PORT: ${{ steps.mail.outputs.live_port }}
          MAIL_ROLE: ${{ vars.MAIL_ROLE }}
          SMTP_GMAIL_DEPLOY_USERNAME: ${{ secrets.SMTP_GMAIL_DEPLOY_USERNAME }}
          SMTP_GMAIL_DEPLOY_PASSWORD: ${{ secrets.SMTP_GMAIL_DEPLOY_PASSWORD }}
          SMTP_FASTMAIL_DEPLOY_USERNAME: ${{ secrets.SMTP_FASTMAIL_DEPLOY_USERNAME }}
          SMTP_FASTMAIL_DEPLOY_PASSWORD: ${{ secrets.SMTP_FASTMAIL_DEPLOY_PASSWORD }}
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.KAMAL_REGISTRY_PASSWORD }}
          # Claude API key for superadmin-triggered translation. This step
          # enumerates every secret rather than inheriting them, so a secret
          # added to `.kamal/secrets` and `config/deploy.yml` but not here
          # expands to empty at deploy time -- the feature would simply be
          # absent in production, with nothing failing to say so.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          case "$MAIL_ROLE" in
            gmail)
              export SMTP_USERNAME="$SMTP_GMAIL_DEPLOY_USERNAME"
              export SMTP_PASSWORD="$SMTP_GMAIL_DEPLOY_PASSWORD" ;;
            fastmail)
              export SMTP_USERNAME="$SMTP_FASTMAIL_DEPLOY_USERNAME"
              export SMTP_PASSWORD="$SMTP_FASTMAIL_DEPLOY_PASSWORD" ;;
            *)
              echo "MAIL_ROLE is '${MAIL_ROLE}' -- refusing to deploy mail configured for nobody" >&2
              exit 1 ;;
          esac

          if [ -z "$SMTP_USERNAME" ] || [ -z "$SMTP_PASSWORD" ]; then
            echo "the ${MAIL_ROLE} deploy credentials are empty -- are the environment secrets set?" >&2
            exit 1
          fi

          echo "shipping mail via ${MAIL_ROLE} (${SMTP_ADDRESS}:${SMTP_PORT})"
          bundle exec kamal ${{ inputs.command }}

      # `always()` matters more than it looks: without it a failed deploy leaves
      # port 22 open to that runner's address indefinitely, and the address is
      # recycled to other GitHub customers. `|| true` covers the case where the
      # Azure login itself failed and there is no rule to remove.
      - name: Close SSH again
        if: always()
        run: |
          # Same upstream flakiness applies here, and this one matters more than
          # opening did: a rule left behind means port 22 stays open to an
          # address GitHub recycles to other customers.
          #
          # Deliberately does NOT fail the job -- that would mark a successful
          # deploy as failed -- but it does emit a ::error:: annotation, because
          # a silent cleanup failure is the one outcome nobody would notice.
          # `az ... delete` also exits 0 when the rule does not exist, so the
          # case where login failed and nothing was ever created passes cleanly.
          cleaned=no
          for attempt in 1 2 3 4 5; do
            if az network nsg rule delete \
                 --resource-group mezineu --nsg-name webNSG \
                 --name "gha-jit-${{ github.run_id }}" \
                 --output none 2>/dev/null; then
              cleaned=yes
              break
            fi
            echo "cleanup attempt ${attempt} failed; retrying in 10s"
            sleep 10
          done
          if [ "$cleaned" != "yes" ]; then
            echo "::error::Failed to remove JIT rule gha-jit-${{ github.run_id }} from webNSG after 5 attempts. Port 22 may still be open to this runner's address. Remove it by hand."
          fi
          # The ::error:: above is easy to miss on an otherwise-green run, so the
          # same fact is repeated in the job summary. See "Write the run summary".
          echo "NSG_CLEANED=${cleaned}" >> "$GITHUB_ENV"
          echo "::group::Remaining inbound rules on webNSG"
          az network nsg rule list --resource-group mezineu --nsg-name webNSG \
            --query "[].{name:name,priority:priority,ports:destinationPortRange}" -o table 2>/dev/null || true
          echo "::endgroup::"

      # The run's Summary tab is empty on every deploy today, so answering "what
      # did run #40 actually do" means opening the job and reading three
      # separate step logs. This fills it in: which subcommand, against which
      # commit and host, from which address, and whether the JIT firewall rule
      # was removed again.
      #
      # `always()` for the same reason `Close SSH again` has it -- a failed
      # deploy is precisely when you want the summary, and it is the run where
      # the JIT-rule row matters most.
      - name: Write the run summary
        if: always()
        env:
          # Passed through `env:` rather than interpolated into the script:
          # `${{ }}` inside `run:` is substituted before bash sees the line, so
          # a value containing shell metacharacters would execute. `command` is
          # a `choice` input and GitHub validates it against the options list,
          # so this one is not actually attacker-controlled -- but the habit is
          # what keeps the next added field safe.
          KAMAL_COMMAND: ${{ inputs.command }}
          JOB_STATUS: ${{ job.status }}
        run: |
          # Read the target out of config/deploy.yml rather than writing the
          # address a fourth time (it is already there twice, plus the host-key
          # pin above). Falls back rather than failing: this step must never be
          # the thing that turns a good deploy red.
          deploy_host=$(ruby -ryaml -e 'puts YAML.load_file("config/deploy.yml")["servers"]["web"].first' 2>/dev/null || echo "unknown")

          case "${NSG_CLEANED:-}" in
            yes) jit_rule="✅ removed" ;;
            no)  jit_rule="❌ **NOT removed — port 22 may still be open to the address above. Delete \`gha-jit-${GITHUB_RUN_ID}\` from webNSG by hand.**" ;;
            *)   jit_rule="➖ never created (the job stopped before opening it)" ;;
          esac

          if [ -n "${JIT_SOURCE_IP:-}" ]; then
            opened_for="\`${JIT_SOURCE_IP}/32\`"
          else
            opened_for="— (runner address never determined)"
          fi

          case "$JOB_STATUS" in
            success)   result="✅ success" ;;
            failure)   result="❌ failure" ;;
            cancelled) result="⚠️ cancelled" ;;
            *)         result="$JOB_STATUS" ;;
          esac

          {
            echo "## \`kamal ${KAMAL_COMMAND}\` → production"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Result | ${result} |"
            echo "| Commit | \`${GITHUB_SHA:0:7}\` on \`${GITHUB_REF_NAME}\` |"
            echo "| Target host | \`${deploy_host}\` |"
            echo "| SSH opened for | ${opened_for} |"
            echo "| JIT firewall rule | ${jit_rule} |"
          } >> "$GITHUB_STEP_SUMMARY"

      # Proves the exact SMTP credential THIS deploy just shipped -- a
      # different credential from the one the six-hourly smtp-probe.yml
      # workflow uses, and that difference is deliberate, not an
      # inconsistency to "fix":
      #
      # This job already carries `environment: production` (see line 21), so
      # it already holds the REAL secrets.SMTP_USERNAME/SMTP_PASSWORD with no
      # second approval needed -- that environment is exactly what an
      # unattended six-hourly schedule cannot use (required-reviewer
      # protected; see smtp-probe.yml's own comment on this). smtp-probe.yml
      # instead authenticates with SMTP_PROBE_USERNAME/SMTP_PROBE_PASSWORD, a
      # dedicated app password on the same Gmail account stored as a
      # repository secret, which proves the ACCOUNT is healthy (catches
      # suspension, the daily-quota trip, Google blocking the account,
      # network/TLS breakage) but says nothing about whether the credential
      # actually shipped to production still authenticates -- e.g. that
      # specific credential being rotated or revoked elsewhere. This step
      # closes exactly that gap, once per deploy, with the secret that
      # matters, and needs no separate schedule or approval to do it.
      #
      # `inputs.command == 'deploy'`, the same check "Write the run summary"
      # above already reads via KAMAL_COMMAND, rather than inventing a second
      # way to tell `deploy` and `setup` apart: `setup` boots accessories and
      # is not what ships an app credential, so there is nothing new to
      # verify. `success()` skips this when an earlier step (including the
      # `Deploy` step itself) failed -- checking a credential from a deploy
      # that didn't happen would prove nothing.
      #
      # A failure HERE does not mean the deploy failed -- the deploy already
      # completed by the time this step runs. It means the mail credential
      # this deploy just shipped does not authenticate. The step name says so
      # on purpose; don't shorten it to something that could read as deploy
      # failure.
      #
      # Reuses the Ruby "Install Ruby and gems" already set up for this job
      # (line 44) -- no second setup-ruby step needed.
      - name: Verify the shipped SMTP credential (the deploy itself already completed)
        if: success() && inputs.command == 'deploy'
        env:
          SMTP_ADDRESS: ${{ steps.mail.outputs.live_host }}
          SMTP_PORT: ${{ steps.mail.outputs.live_port }}
          SMTP_LIVE_VENDOR: ${{ steps.mail.outputs.live_vendor }}
          SMTP_STANDBY_VENDOR: ${{ steps.mail.outputs.standby_vendor }}
          # Literal, matching config/deploy.yml's env.clear.APP_HOST -- see
          # smtp-probe.yml's own "Probe both endpoints" step for why this is a
          # literal rather than a repository variable (there are none here).
          APP_HOST: game.mezin.eu
          MAIL_ROLE: ${{ vars.MAIL_ROLE }}
          SMTP_GMAIL_DEPLOY_USERNAME: ${{ secrets.SMTP_GMAIL_DEPLOY_USERNAME }}
          SMTP_GMAIL_DEPLOY_PASSWORD: ${{ secrets.SMTP_GMAIL_DEPLOY_PASSWORD }}
          SMTP_FASTMAIL_DEPLOY_USERNAME: ${{ secrets.SMTP_FASTMAIL_DEPLOY_USERNAME }}
          SMTP_FASTMAIL_DEPLOY_PASSWORD: ${{ secrets.SMTP_FASTMAIL_DEPLOY_PASSWORD }}
          SMTP_SPARE_ADDRESS: ${{ steps.mail.outputs.standby_host }}
          SMTP_SPARE_PORT: ${{ steps.mail.outputs.standby_port }}
          # The spare's values are the PROBE secrets, not the deploy secrets:
          # the deploy credentials for the standby vendor are not what the
          # six-hourly probe watches, so verifying against them here would
          # prove nothing about the thing that actually gets exercised.
          SMTP_GMAIL_PROBE_USERNAME: ${{ secrets.SMTP_GMAIL_PROBE_USERNAME }}
          SMTP_GMAIL_PROBE_PASSWORD: ${{ secrets.SMTP_GMAIL_PROBE_PASSWORD }}
          SMTP_FASTMAIL_PROBE_USERNAME: ${{ secrets.SMTP_FASTMAIL_PROBE_USERNAME }}
          SMTP_FASTMAIL_PROBE_PASSWORD: ${{ secrets.SMTP_FASTMAIL_PROBE_PASSWORD }}
        run: |
          set -euo pipefail
          case "$MAIL_ROLE" in
            gmail)
              export SMTP_USERNAME="$SMTP_GMAIL_DEPLOY_USERNAME"
              export SMTP_PASSWORD="$SMTP_GMAIL_DEPLOY_PASSWORD" ;;
            fastmail)
              export SMTP_USERNAME="$SMTP_FASTMAIL_DEPLOY_USERNAME"
              export SMTP_PASSWORD="$SMTP_FASTMAIL_DEPLOY_PASSWORD" ;;
            *)
              echo "MAIL_ROLE is '${MAIL_ROLE}' -- refusing to verify a credential shipped for nobody" >&2
              exit 1 ;;
          esac

          case "$SMTP_STANDBY_VENDOR" in
            gmail)
              export SMTP_SPARE_USERNAME="$SMTP_GMAIL_PROBE_USERNAME"
              export SMTP_SPARE_PASSWORD="$SMTP_GMAIL_PROBE_PASSWORD" ;;
            fastmail)
              export SMTP_SPARE_USERNAME="$SMTP_FASTMAIL_PROBE_USERNAME"
              export SMTP_SPARE_PASSWORD="$SMTP_FASTMAIL_PROBE_PASSWORD" ;;
            *)
              echo "standby vendor is '${SMTP_STANDBY_VENDOR}' -- refusing to probe nothing" >&2
              exit 1 ;;
          esac

          set +e
          ruby ops/smtp/probe.rb > verdict.json
          exit_code=$?
          set -e

          {
            echo "## Deploy-time SMTP credential check"
            echo
            echo "Proves the credential THIS deploy just shipped -- a different"
            echo "credential from the one the six-hourly probe uses (see"
            echo "smtp-probe.yml). A failure below means the shipped mail"
            echo "credential does not authenticate, not that the deploy failed"
            echo "-- the deploy already completed."
            echo
            echo '```json'
            # Falls back rather than failing this block outright: under `set
            # -e`, a missing verdict.json (the probe script itself crashed,
            # not just a bad verdict) would otherwise abort here before
            # `exit "$exit_code"` below runs, leaving the summary half-written
            # and the real exit code unreported.
            cat verdict.json 2>/dev/null || echo '(no verdict.json was written -- see the run log above)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$exit_code"
